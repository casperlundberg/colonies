name: Go

# Was `branches: [ main ]`, inherited from upstream. All fork work happens on
# priority-channel, so this workflow had never run once.
#
# No `push` trigger on purpose: image.yml calls this as a gate before the image
# is built, so a push would run the whole suite twice. Pull requests still get
# it directly.
on:
  workflow_call:
  pull_request:
  workflow_dispatch:

jobs:
  # Label of the container job
  runner-job:
    runs-on: ubuntu-latest

    # Service containers to run with `runner-job`
    services:
      minio:
        image: fclairamb/minio-github-actions
        ports:
          - 9000:9000
        env:
          MINIO_DOMAIN: localhost
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: rFcLGNkgsNtksg6Pgtn9CumL4xXBQ7
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.5
        cache: true

    - name: Build
      run: make 

    - name: Test
      run: make test
      env:
        # Not cosmetic. Without TZ the DB layer errors with "Timezon
        # environmental variable missing" and then segfaults in a deferred
        # Close(), and TestPriorityTime fails by exactly the UTC offset.
        TZ: Europe/Stockholm
        AWS_S3_ENDPOINT: localhost:9000
        AWS_S3_ACCESSKEY: minioadmin
        AWS_S3_SECRETKEY: minioadmin
        AWS_S3_TLS: false
        AWS_S3_SKIPVERIFY: false
        AWS_S3_BUCKET: test
        COLONIES_DB_USER: postgres
        COLONIES_DB_PASSWORD: rFcLGNkgsNtksg6Pgtn9CumL4xXBQ7
        COLONIES_DB_HOST: localhost

