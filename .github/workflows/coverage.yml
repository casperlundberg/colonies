name: Coverage

# Split out of go.yml so image.yml can run this as a job parallel to
# build-and-push-image instead of a step inside the same job go.yml's
# `test` job blocks on. A reusable-workflow-call job in the caller isn't
# done until every job in the CALLED workflow finishes, so a coverage job
# living inside go.yml would still make build-and-push-image wait on it --
# only a separate workflow file actually decouples the two.
#
# Same trigger set as go.yml, for the same reason: no `push` (image.yml
# calls this as a parallel job, so a push would run it twice), pull
# requests still get it directly.
on:
  workflow_call:
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      minio:
        image: fclairamb/minio-github-actions
        ports:
          - 9000:9000
        env:
          MINIO_DOMAIN: localhost
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: rFcLGNkgsNtksg6Pgtn9CumL4xXBQ7
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.5
        cache: true

    # Reporting, not a gate: go.yml's Test step is what decides correctness,
    # and the Codecov upload below already declares fail_ci_if_error: false.
    - name: Generate coverage
      continue-on-error: true
      run: |
        # Get package list excluding monitoring
        PKGS=$(go list ./pkg/... | grep -v '/monitoring$' | tr '\n' ' ')
        # Run tests with coverage
        # Use -coverpkg to measure client package coverage through server tests
        go test -p 1 -race -coverprofile=coverage.raw -covermode=atomic -coverpkg=./pkg/... $PKGS
        # Filter out test utilities, mocks, and monitoring from coverage report
        grep -v 'pkg/server/test_utils.go' coverage.raw | \
        grep -v 'pkg/monitoring/' | \
        grep -v '_mock.go' | \
        grep -v 'mock_test.go' > coverage.out
        rm coverage.raw
      env:
        TZ: Europe/Stockholm
        AWS_S3_ENDPOINT: localhost:9000
        AWS_S3_ACCESSKEY: minioadmin
        AWS_S3_SECRETKEY: minioadmin
        AWS_S3_TLS: false
        AWS_S3_SKIPVERIFY: false
        AWS_S3_BUCKET: test
        COLONIES_DB_USER: postgres
        COLONIES_DB_PASSWORD: rFcLGNkgsNtksg6Pgtn9CumL4xXBQ7
        COLONIES_DB_HOST: localhost

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
